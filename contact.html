<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/sombre.js" defer></script>
    <script src="js/form.js" defer></script>
    <title>Me contacter</title>
</head>
<body>
    <header>
        <h1>Tom Faderne</h1>
        <nav>
            <a href="index.html">Retour à l'accueil</a>
            <a href="contact.html">Contact</a>
            <a href="https://www.youtube.com" target="_blank">Youtube</a>
            <button id="theme">Mode sombre</button>
        </nav>
    </header>
    <main>
        <form id="form" class="contact-card" novalidate>
                <h2>Me contacter</h2>

                <label for="nom">Nom</label>
                <input class="champ" type="text" id="nom" name="nom" placeholder="Votre nom" required>

                <label for="email">Email</label>
                <input class="champ" type="email" id="email" name="email" placeholder="Votre email" required>

                <label for="sujet">Sujet</label>
                <select class="champ" id="sujet" name="sujet">
                    <option>Support</option>
                    <option>Proposition</option>
                    <option>Autre</option>
                </select>

                <label for="msg">Message</label>
                <textarea class="champ" id="msg" name="msg" rows="4" placeholder="Votre message"></textarea>
                <p id="compteur">0 caractères</p>

                <div class="checkbox-field">
                    <input type="checkbox" id="cgu" name="cgu">
                    <label for="cgu">J'accepte d'être recontacté(e)</label>
                </div>

                <ul id="erreurs"></ul>
                <button type="submit">Envoyer</button>
        </form>
    </main>
    <footer> 
        <p>© 2026 Tom</p>
    </footer>
</body>
</html>
